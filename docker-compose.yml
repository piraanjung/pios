version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pios
    container_name: pios
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    networks:
      - laravel-net

networks:
  laravel-net:
    driver: bridge