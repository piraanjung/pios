services:
  nginx:
    image: nginx:1.27-alpine
    container_name: pios_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - pios_net

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: pios_app
    restart: unless-stopped
    working_dir: /var/www/html
    entrypoint: ["/var/www/html/docker/php/entrypoint.sh"]
    command: ["php-fpm"]
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8080"
      DB_CONNECTION: envsogo_main
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: pios
      DB_USERNAME: pios
      DB_PASSWORD: secret
      DB_HOST_S_ADMIN: db
      DB_PORT_S_ADMIN: 3306
      DB_DATABASE_S_ADMIN: pios
      DB_USERNAME_S_ADMIN: pios
      DB_PASSWORD_S_ADMIN: secret
      DB_HOST_TENANT: db
      DB_PORT_TENANT: 3306
      DB_DATABASE_TENANT: pios
      DB_USERNAME_TENANT: pios
      DB_PASSWORD_TENANT: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      VITE_PORT: 5173
      VITE_HMR_HOST: localhost
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pios_net

  db:
    image: mysql:8.0
    container_name: pios_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: pios
      MYSQL_USER: pios
      MYSQL_PASSWORD: secret
    ports:
      - "33068:3306"
    volumes:
      - pios_mysql_data:/var/lib/mysql
      - ./docker/mysql/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - pios_net

  redis:
    image: redis:7-alpine
    container_name: pios_redis
    restart: unless-stopped
    ports:
      - "63798:6379"
    volumes:
      - pios_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - pios_net

  vite:
    image: node:20-alpine
    container_name: pios_vite
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - pios_node_modules:/var/www/html/node_modules
    command: >
      sh -c "npm run dev -- --host 0.0.0.0"
    networks:
      - pios_net

  phpmyadmin:
    image: phpmyadmin:5
    container_name: pios_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: pios
      PMA_PASSWORD: secret
      UPLOAD_LIMIT: 256M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pios_net

volumes:
  pios_mysql_data:
  pios_redis_data:
  pios_node_modules:

networks:
  pios_net:
    driver: bridge
