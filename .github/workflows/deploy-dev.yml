name: CI/CD - Deploy to z.com cPanel

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      target_site:
        description: "เลือก Site ปลายทางที่ต้องการ Deploy (ค่าเริ่มต้น: develop)"
        required: true
        default: "develop"
        type: string

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 1. CI QUALITY GATE: ตรวจสอบความถูกต้องและรัน Automated Tests
  # =========================================================================
  test:
    name: "1. Automated Tests & CI Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, gd, intl, zip, pdo_sqlite, pdo_mysql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-ci-v2-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-ci-v2-${{ runner.os }}-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Environment File for Testing
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run PHPUnit Tests
        env:
          APP_ENV: testing
          APP_KEY: base64:4k8kUaK4aQ7l7oR/7v5Qc8hFz7TqG5xW9v0N2p4r6s8=
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test

  # =========================================================================
  # 2. CD BUILD & DEPLOY: คอมไพล์โปรเจกต์และอัปโหลดไปยัง z.com cPanel
  # =========================================================================
  deploy:
    name: "2. Build & Deploy to z.com cPanel"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Target Deploy Path
        id: target
        run: |
          TARGET_KEY="${{ github.event.inputs.target_site || 'develop' }}"
          echo "Target Site Key: $TARGET_KEY"

          DEPLOY_PATH=$(python3 -c "
          import json, sys
          with open('.github/deploy-sites.dev.json') as f:
              sites = json.load(f)
          key = sys.argv[1]
          if key in sites:
              print(sites[key]['path'])
          else:
              print('NOT_FOUND')
          " "$TARGET_KEY")

          if [ "$DEPLOY_PATH" = "NOT_FOUND" ] || [ -z "$DEPLOY_PATH" ]; then
              echo "::error::Target site '$TARGET_KEY' ไม่พบใน .github/deploy-sites.dev.json"
              exit 1
          fi

          # แปลง path /home/user/public_html/... ให้เป็น relative path สำหรับ cPanel FTP (public_html/...)
          FTP_PATH=$(echo "$DEPLOY_PATH" | sed -E 's|^/home/[^/]+/||' | sed -E 's|^/||')

          echo "deploy_path=$DEPLOY_PATH" >> $GITHUB_OUTPUT
          echo "ftp_path=$FTP_PATH" >> $GITHUB_OUTPUT
          echo "target_key=$TARGET_KEY" >> $GITHUB_OUTPUT
          echo "Filesystem path: $DEPLOY_PATH"
          echo "FTP relative path: $FTP_PATH"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, gd, intl, zip, pdo_mysql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-prod-v2-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-prod-v2-${{ runner.os }}-

      - name: Install Composer Dependencies (Production)
        run: composer install --prefer-dist --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Front-end Assets
        run: npm run build

      - name: Prepare Storage and Cache Folders for Deployment
        run: |
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache public/uploads
          touch storage/framework/cache/data/.gitkeep storage/framework/sessions/.gitkeep storage/framework/views/.gitkeep storage/logs/.gitkeep bootstrap/cache/.gitkeep public/uploads/.gitkeep

      - name: Deploy Code via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_HOST || secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_FTP_USER || secrets.DEV_SSH_USER }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          port: ${{ secrets.DEV_FTP_PORT || 21 }}
          protocol: ftp
          server-dir: ${{ secrets.DEV_FTP_SERVER_DIR || '/' }}
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env*
            **/node_modules/**
            **/tests/**
            docs/database.sql
            repomix-output.xml
            **/.DS_Store

      - name: Trigger Post-Deploy Sync & Optimization via Webhook
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          TARGET_KEY="${{ steps.target.outputs.target_key }}"
          DOMAIN="${TARGET_KEY}.z25890-fg43st.ps10.zwhhosting.com"
          if [ -n "$DEPLOY_SECRET" ]; then
            echo "Invoking deploy sync endpoint on https://${DOMAIN}/deploy/sync ..."
            RESPONSE=$(curl -k -s "https://${DOMAIN}/deploy/sync?token=${DEPLOY_SECRET}" || true)
            echo "Sync Response: $RESPONSE"
          else
            echo "Notice: DEPLOY_SECRET is not configured in GitHub Secrets. You can trigger migrations manually in cPanel Terminal via: php artisan migrate --force"
          fi

