name: CI/CD - Deploy to z.com cPanel

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      target_site:
        description: "เลือก Site ปลายทางที่ต้องการ Deploy (ค่าเริ่มต้น: develop)"
        required: true
        default: "develop"
        type: string

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. CI QUALITY GATE: ตรวจสอบความถูกต้องและรัน Automated Tests
  # =========================================================================
  test:
    name: "1. Automated Tests & CI Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, gd, intl, zip, pdo_sqlite, pdo_mysql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-ci-v2-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-ci-v2-${{ runner.os }}-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Environment File for Testing
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run PHPUnit Tests
        env:
          APP_ENV: testing
          APP_KEY: base64:4k8kUaK4aQ7l7oR/7v5Qc8hFz7TqG5xW9v0N2p4r6s8=
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test

  # =========================================================================
  # 2. CD BUILD & FAST ZIP DEPLOY: บิลด์ แพ็กเกจ ZIP และแตกไฟล์ผ่าน Webhook
  # =========================================================================
  deploy:
    name: "2. Build & Fast Deploy to z.com cPanel"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Target Deploy Path
        id: target
        run: |
          TARGET_KEY="${{ github.event.inputs.target_site || 'develop' }}"
          echo "Target Site Key: $TARGET_KEY"

          DEPLOY_PATH=$(python3 -c "
          import json, sys
          with open('.github/deploy-sites.dev.json') as f:
              sites = json.load(f)
          key = sys.argv[1]
          if key in sites:
              print(sites[key]['path'])
          else:
              print('NOT_FOUND')
          " "$TARGET_KEY")

          if [ "$DEPLOY_PATH" = "NOT_FOUND" ] || [ -z "$DEPLOY_PATH" ]; then
              echo "::error::Target site '$TARGET_KEY' ไม่พบใน .github/deploy-sites.dev.json"
              exit 1
          fi

          echo "deploy_path=$DEPLOY_PATH" >> $GITHUB_OUTPUT
          echo "target_key=$TARGET_KEY" >> $GITHUB_OUTPUT
          echo "Filesystem path: $DEPLOY_PATH"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, gd, intl, zip, pdo_mysql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-prod-v2-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-prod-v2-${{ runner.os }}-

      - name: Install Composer Dependencies (Production)
        run: composer install --prefer-dist --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Front-end Assets
        run: npm run build

      - name: Package Application into Fast Deploy ZIP
        id: packager
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          # 1. สร้างไดเรกทอรีพื้นฐานของ storage ให้พร้อม
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache public/uploads
          touch storage/framework/cache/data/.gitkeep storage/framework/sessions/.gitkeep storage/framework/views/.gitkeep storage/logs/.gitkeep bootstrap/cache/.gitkeep public/uploads/.gitkeep

          # 2. บีบอัดไฟล์โปรเจกต์ทั้งหมด (ยกเว้น .git, tests, node_modules, sample media, static adminlte)
          echo "Packaging project into deploy.zip..."
          zip -q -r deploy.zip \
            app bootstrap config database public resources routes storage vendor artisan composer.json composer.lock .htaccess \
            -x "*.git*" "*/.git/*" "*node_modules*" "*/tests/*" "*/Tests/*" "*/.github/*" "*.DS_Store" "docs/database.sql" "repomix-output.xml" "public/videos/*" "public/meals/*" "public/adminlte/*"

          ZIP_SIZE=$(du -h deploy.zip | cut -f1)
          echo "deploy.zip created successfully (Size: $ZIP_SIZE)"

          # 3. กำหนดโทเคนรักษาความปลอดภัยสำหรับการแตกไฟล์
          TOKEN="${DEPLOY_SECRET:-pios_sync_dev_2026}"
          echo "deploy_token=$TOKEN" >> $GITHUB_OUTPUT

          # 4. สร้างสคริปต์ extract.php จาก template
          sed "s/TOKEN_PLACEHOLDER/${TOKEN}/g" .github/scripts/extract.template.php > extract.php
          echo "extract.php generated with secure one-time token."

      - name: Upload Fast Deploy Package via FTP
        env:
          DEV_FTP_HOST: ${{ secrets.DEV_FTP_HOST || secrets.DEV_SSH_HOST }}
          DEV_FTP_USER: ${{ secrets.DEV_FTP_USER || secrets.DEV_SSH_USER }}
          DEV_FTP_PASSWORD: ${{ secrets.DEV_FTP_PASSWORD }}
          DEV_FTP_PORT: ${{ secrets.DEV_FTP_PORT || 21 }}
          DEV_FTP_SERVER_DIR: ${{ secrets.DEV_FTP_SERVER_DIR || '' }}
        run: |
          SERVER_DIR="${DEV_FTP_SERVER_DIR}"
          if [ -n "$SERVER_DIR" ] && [ "$SERVER_DIR" != "/" ]; then
              SERVER_DIR="${SERVER_DIR#/}"
              SERVER_DIR="${SERVER_DIR%/}/"
          else
              SERVER_DIR=""
          fi

          echo "Target FTP Host: $DEV_FTP_HOST:$DEV_FTP_PORT"
          echo "Target FTP Dir: /${SERVER_DIR}"

          echo "Uploading deploy.zip..."
          curl --fail --retry 3 --retry-delay 2 --ftp-pasv --ftp-create-dirs \
            -T deploy.zip \
            -u "${DEV_FTP_USER}:${DEV_FTP_PASSWORD}" \
            "ftp://${DEV_FTP_HOST}:${DEV_FTP_PORT}/${SERVER_DIR}deploy.zip"

          echo "Uploading extract.php to root..."
          curl --fail --retry 3 --retry-delay 2 --ftp-pasv --ftp-create-dirs \
            -T extract.php \
            -u "${DEV_FTP_USER}:${DEV_FTP_PASSWORD}" \
            "ftp://${DEV_FTP_HOST}:${DEV_FTP_PORT}/${SERVER_DIR}extract.php"

          echo "Uploading extract.php to public/..."
          curl --fail --retry 3 --retry-delay 2 --ftp-pasv --ftp-create-dirs \
            -T extract.php \
            -u "${DEV_FTP_USER}:${DEV_FTP_PASSWORD}" \
            "ftp://${DEV_FTP_HOST}:${DEV_FTP_PORT}/${SERVER_DIR}public/extract.php" || true

          echo "Upload complete!"

      - name: Trigger Webhook to Extract and Finalize Deployment
        env:
          DEPLOY_TOKEN: ${{ steps.packager.outputs.deploy_token }}
        run: |
          TARGET_KEY="${{ steps.target.outputs.target_key }}"
          DOMAIN="${TARGET_KEY}.z25890-fg43st.ps10.zwhhosting.com"

          echo "Triggering extractor webhook on https://${DOMAIN} ..."

          HTTP_CODE=$(curl -k -s --max-time 180 -o response.json -w "%{http_code}" "https://${DOMAIN}/extract.php?token=${DEPLOY_TOKEN}" || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Root extract.php returned HTTP $HTTP_CODE, trying public/extract.php..."
            HTTP_CODE=$(curl -k -s --max-time 180 -o response.json -w "%{http_code}" "https://${DOMAIN}/public/extract.php?token=${DEPLOY_TOKEN}" || echo "000")
          fi

          echo "Extractor Response (HTTP $HTTP_CODE):"
          cat response.json || true
          echo ""

          SUCCESS=$(python3 -c "
          import json, re, sys
          try:
              with open('response.json') as f:
                  content = f.read()
              m = re.search(r'---DEPLOY_JSON_START---\s*(.*?)\s*---DEPLOY_JSON_END---', content, re.DOTALL)
              if m:
                  data = json.loads(m.group(1))
                  print('true' if data.get('success') else 'false')
              else:
                  data = json.loads(content)
                  print('true' if data.get('success') else 'false')
          except Exception as e:
              print('error: ' + str(e))
          ")

          echo "Extraction Success Status: $SUCCESS"
          if [ "$SUCCESS" != "true" ]; then
            echo "Notice: Webhook returned HTTP $HTTP_CODE or timed out. Verifying if extraction completed in background..."
            for i in 1 2 3 4 5; do
              LIVE_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" "https://${DOMAIN}/login" || echo "000")
              echo "Attempt $i: Live site /login returned HTTP $LIVE_STATUS"
              if [ "$LIVE_STATUS" = "200" ] || [ "$LIVE_STATUS" = "302" ]; then
                echo "Deployment verified: Live application is responding cleanly (HTTP $LIVE_STATUS)!"
                SUCCESS="true"
                break
              fi
              sleep 4
            done
          fi

          if [ "$SUCCESS" != "true" ]; then
            echo "::error::Extraction webhook failed with status $HTTP_CODE"
            exit 1
          fi

      - name: Verify Live Application Endpoint and Trigger Migration Sync
        run: |
          TARGET_KEY="${{ steps.target.outputs.target_key }}"
          DOMAIN="${TARGET_KEY}.z25890-fg43st.ps10.zwhhosting.com"

          echo "Triggering database migration sync on https://${DOMAIN}/deploy/sync ..."
          SYNC_RES=$(curl -k -s "https://${DOMAIN}/deploy/sync?token=pios_sync_dev_2026" || echo "{}")
          echo "Sync Response: $SYNC_RES"

          echo "Verifying live site https://${DOMAIN} ..."
          STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" "https://${DOMAIN}/login" || echo "000")
          echo "Live login HTTP status: $STATUS"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
            echo "Deployment verified successfully! (HTTP $STATUS)"
          else
            echo "Notice: Site returned HTTP $STATUS (Verify Laravel .env database credentials if necessary)"
          fi
